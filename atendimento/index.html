function showTyping(){

function stepVideo(){
  return new Promise(function(res){
    var t=showTyping();
    setTimeout(function(){
      t.remove();
      var row=document.createElement('div');row.className='msg-row';
      row.innerHTML='<img class="av" src="'+AV+'"/><div class="video-bubble"><video id="att-video" src="../video/video-sr.mp4" playsinline preload="auto" disablepictureinpicture></video><button class="play-overlay" id="play-btn" aria-label="Ativar som"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button></div>';
      chat.appendChild(row);scrollDown();
      var v=row.querySelector('video'),b=row.querySelector('#play-btn');
      v.loop=false;
      try{v.removeAttribute('loop');}catch(e){}
      v.muted=false;
      v.volume=1;
      function hideBtn(){b.style.display='none';}
      function showBtn(){if(!v.ended)b.style.display='flex';}
      function activateSound(){
        if(v.ended)return;
        v.muted=false;
        v.volume=1;
        try{v.removeAttribute('muted');}catch(e){}
        var pr=v.play();if(pr&&pr.catch)pr.catch(function(){});
        hideBtn();
      }
      v.onended=function(){try{v.pause();}catch(e){}b.style.display='none';};
      try{v.removeAttribute('muted');}catch(e){}
      var p=v.play();
      if(p&&p.then){
        p.then(function(){hideBtn();}).catch(function(){
          v.muted=true;
          var pm=v.play();
          if(pm&&pm.then){
            pm.then(function(){
              setTimeout(function(){
                v.muted=false;v.volume=1;
                try{v.removeAttribute('muted');}catch(e){}
                var p2=v.play();if(p2&&p2.catch)p2.catch(function(){});
                if(!v.muted)hideBtn();
              },300);
            }).catch(function(){showBtn();});
          }
        });
      }
      v.onplaying=function(){if(!v.muted&&!v.ended)hideBtn();};
      v.onpause=function(){if(!v.ended)showBtn();};
      v.onended=function(){try{v.pause();}catch(e){}b.style.display='none';};
      b.onclick=function(){activateSound();};
      var unlock=function(){if(v.ended)return;v.muted=false;v.volume=1;try{v.removeAttribute('muted');}catch(e){}if(!v.paused&&!v.muted)hideBtn();else{var pr=v.play();if(pr&&pr.catch)pr.catch(function(){});}};
      document.addEventListener('touchstart',unlock,{once:true});
      document.addEventListener('click',unlock,{once:true});
      setTimeout(res,600);
    },3000);
  });
}
