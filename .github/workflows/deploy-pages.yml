name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project:
          - consultanome
          - consultacpf
          - consultanomeja
    steps:
      - uses: actions/checkout@v4
      # Mesmo fluxo do Funil-SR antigo (negociacpf/…): wrangler upload da pasta OFERTA CS
      # sem .private (fora do git). Functions em OFERTA CS/functions/.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.164.0"
          command: pages deploy "OFERTA CS" --project-name=${{ matrix.project }} --branch=main --commit-dirty=true
