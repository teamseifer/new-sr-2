  <!-- ═══════════════════════════════════════════════════════════
       TRACKING PIX — InitiateCheckout + Purchase
       Intercepta o fetch do app React para capturar geração e
       confirmação de pagamento sem tocar no código compilado.
  ════════════════════════════════════════════════════════════ -->
  <script>
    (function () {
      'use strict';

      var PIX_AMOUNT_DEFAULT = 65.70;
      var TRACKED = {};

      /* ── Helpers ─────────────────────────────────────────────── */
      function getUtms() {
        try { return JSON.parse(localStorage.getItem('utmData') || '{}'); } catch (e) { return {}; }
      }

      function getFbp() {
        var m = document.cookie.match(/(^|;)\s*_fbp=([^;]+)/);
        return m ? m[2] : null;
      }

      function getFbc() {
        var m = document.cookie.match(/(^|;)\s*_fbc=([^;]+)/);
        if (m) return m[2];
        var fbclid = new URLSearchParams(window.location.search).get('fbclid');
        return fbclid ? 'fb.1.' + Date.now() + '.' + fbclid : null;
      }

      function firePixel(eventName, params) {
        try { if (window.fbq) fbq('track', eventName, params || {}); } catch (e) { }
      }

      function sendCAPI(eventName, data) {
        try {
          var utms = getUtms();
          var body = Object.assign({
            event: eventName,
            currency: 'BRL',
            fbclid: utms.fbclid || new URLSearchParams(window.location.search).get('fbclid') || undefined,
            fbp: getFbp() || undefined,
            fbc: getFbc() || undefined,
            event_source_url: window.location.href
          }, data);

          fetch('/api/capi', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          }).catch(function () { });
        } catch (e) { }
      }

      /* ── Polling de pagamento ────────────────────────────────── */
      function startPolling(txId, amount) {
        if (!txId || TRACKED['poll_' + txId]) return;
        TRACKED['poll_' + txId] = true;

        var attempts = 0;
        var max = 72; // 6 min × 5s

        function check() {
          if (++attempts > max) return;
          fetch('/api/check-payment?id=' + encodeURIComponent(txId))
            .then(function (r) { return r.json(); })
            .then(function (d) {
              var s = (d.status || '').toLowerCase();
              if (s === 'paid' || s === 'approved' || s === 'completed') {
                if (!TRACKED['purchase_' + txId]) {
                  TRACKED['purchase_' + txId] = true;
                  var val = parseFloat(amount) || PIX_AMOUNT_DEFAULT;

                  // Meta Pixel client-side
                  firePixel('Purchase', { value: val, currency: 'BRL' });

                  // CAPI server-side
                  sendCAPI('Purchase', { txId: txId, value: val });

                  console.log('[Tracking] Purchase disparado | TX:', txId, '| Valor:', val);
                }
                return; // para o polling
              }
              setTimeout(check, 5000);
            })
            .catch(function () { setTimeout(check, 10000); });
        }

        setTimeout(check, 5000);
      }

      /* ── Intercepta fetch do app React ───────────────────────── */
      var _origFetch = window.fetch;
      window.fetch = function (resource, options) {
        var url = typeof resource === 'string' ? resource : (resource && resource.url) || '';
        var method = (options && options.method || 'GET').toUpperCase();
        var promise = _origFetch.apply(this, arguments);

        // ── PIX gerado ──────────────────────────────────────────
        if (url.includes('/api/pix') && method === 'POST') {
          promise.then(function (response) {
            response.clone().json().then(function (data) {
              if (!data.success) return;
              var txId = data.transaction_id || data.deposit_id;
              if (txId && TRACKED['ic_' + txId]) return;
              if (txId) TRACKED['ic_' + txId] = true;

              var val = parseFloat(data.amount) || PIX_AMOUNT_DEFAULT;

              // Meta Pixel. O pix gerado e o pix pago vao para a UTMify pela Velani.
              firePixel('InitiateCheckout', { value: val, currency: 'BRL', num_items: 1 });

              // CAPI
              sendCAPI('InitiateCheckout', { txId: txId, value: val });

              console.log('[Tracking] InitiateCheckout disparado | TX:', txId);

              // Inicia polling para Purchase
              startPolling(txId, val);
            }).catch(function () { });
          }).catch(function () { });
        }

        return promise;
      };

      console.log('[Tracking PIX] v1.0 — InitiateCheckout + Purchase ativos');
    })();
  </script>
